[project]
name = "signalcatcher"
version = "0.1.0"
description = "Investment signal detection system — catch the next NVIDIA 2012 moment"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.98",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[project.scripts]
signalcatcher = "pipeline.main:cli"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
